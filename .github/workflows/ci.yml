name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      # The version and components pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Clippy, diagnostics build
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      # Includes xtask's repository_passes_policy, the asset-policy check.
      - name: Tests
        shell: bash
        run: |
          set -o pipefail
          # GitHub runs this script with -e; a failing test must still reach
          # the summary and annotation block below.
          set +e
          # The log goes outside the checkout: xtask's repository_passes_policy
          # runs in this step, and it refuses a file in the tree whose type is
          # not on the allowlist.
          log="${RUNNER_TEMP//\\//}/test.log"
          cargo test --workspace --locked 2>&1 | tee "$log"
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            {
              echo "### Tests failed"
              echo '```'
              tail -300 "$log"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            grep -aE 'FAILED|panicked|^error|Running ' "$log" | tail -12 |
              while IFS= read -r line; do
                echo "::error title=test failure::$line"
              done
          fi
          exit "$status"
      # victory-gpu's tests share the write tracker's state and use real
      # memory, whose addresses Windows gives out again. One at a time, a
      # test meets what the ones before it left behind (issue #49).
      # It runs after a failed Tests step too: one at a time the harness
      # prints a test's name before it runs it, so a test that ends the
      # process is named here.
      - name: Tests of victory-gpu, one at a time
        if: ${{ !cancelled() }}
        run: cargo test -p victory-gpu --lib --locked -- --test-threads=1

  launcher:
    # The GUI is its own workspace; the job above never compiles it.
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tools/launcher
      - name: Build the launcher (Windows)
        run: cargo build --release --locked --manifest-path tools/launcher/Cargo.toml
