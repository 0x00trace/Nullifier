name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      # The version and components pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Clippy, diagnostics build
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      # tools/ci-test.sh runs a test command and, if it fails, puts the output
      # in the job summary and the lines that name the failure in error
      # annotations. This step checks that script against stand-ins.
      - name: Check of the test wrapper
        shell: bash
        run: bash tools/check-ci-test.sh
      # Includes xtask's repository_passes_policy, the asset-policy check.
      # victory-gpu is left out here and runs in the next step.
      - name: Tests
        shell: bash
        run: bash tools/ci-test.sh "Tests" cargo test --workspace --exclude victory-gpu --locked
      # victory-gpu's tests run one at a time. Many of them submit work on
      # the one host device and queue, which the layer drives from a single
      # thread: side by side they ended the process with an access violation
      # in three runs out of three on the software adapter here, and one at a
      # time they pass (issue #49). One at a time the harness also prints a
      # test's name before it runs it, so tools/ci-test.sh can name a test
      # that ends the process. The step runs after a failed Tests step too.
      - name: Tests of victory-gpu, one at a time
        if: ${{ !cancelled() }}
        shell: bash
        run: bash tools/ci-test.sh "Tests of victory-gpu, one at a time" cargo test -p victory-gpu --locked -- --test-threads=1

  launcher:
    # The GUI is its own workspace; the job above never compiles it.
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tools/launcher
      - name: Formatting of the launcher
        run: cargo fmt --check --manifest-path tools/launcher/Cargo.toml
      - name: Build the launcher (Windows)
        run: cargo build --release --locked --manifest-path tools/launcher/Cargo.toml
      - name: Clippy, launcher
        run: cargo clippy --all-targets --locked --manifest-path tools/launcher/Cargo.toml -- -D warnings
      # Through tools/ci-test.sh, as in the job above, so that a failure is in
      # the job summary and the error annotations. It runs after a failed
      # Clippy step too.
      - name: Tests of the launcher
        if: ${{ !cancelled() }}
        shell: bash
        run: bash tools/ci-test.sh "Tests of the launcher" cargo test --locked --manifest-path tools/launcher/Cargo.toml
