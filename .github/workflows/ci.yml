name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      # The version and components pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Clippy, diagnostics build
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      # Includes xtask's repository_passes_policy, the asset-policy check.
      - name: Tests
        shell: bash
        run: |
          set -o pipefail
          # GitHub runs this script with -e; a failing test must still reach
          # the summary and annotation block below.
          set +e
          # The log goes outside the checkout: xtask's repository_passes_policy
          # runs in this step, and it refuses a file in the tree whose type is
          # not on the allowlist.
          log="${RUNNER_TEMP//\\//}/test.log"
          # victory-gpu is left out here and runs in the next step.
          cargo test --workspace --exclude victory-gpu --locked 2>&1 | tee "$log"
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            {
              echo "### Tests failed"
              echo '```'
              tail -300 "$log"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            grep -aE 'FAILED|panicked|^error|Running ' "$log" | tail -12 |
              while IFS= read -r line; do
                echo "::error title=test failure::$line"
              done
          fi
          exit "$status"
      # victory-gpu's tests run one at a time. Many of them submit work on
      # the one host device and queue, which the layer drives from a single
      # thread: side by side they ended the process with an access violation
      # in three runs out of three on the software adapter here, and one at a
      # time they pass (issue #49). One at a time the harness also prints a
      # test's name before it runs it, so a test that ends the process is
      # named. The step runs after a failed Tests step too.
      - name: Tests of victory-gpu, one at a time
        if: ${{ !cancelled() }}
        run: cargo test -p victory-gpu --locked -- --test-threads=1

  launcher:
    # The GUI is its own workspace; the job above never compiles it.
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tools/launcher
      - name: Build the launcher (Windows)
        run: cargo build --release --locked --manifest-path tools/launcher/Cargo.toml
