name: Share a run
description: Add one run to the community board (performance and a sanitized log)
title: "run: <nickname> - <fps> fps"
body:
  - type: markdown
    attributes:
      value: |
        In the launcher: **Community → Share last run** copies a block with a
        `json` fence. Paste the whole block below. It already has home paths,
        the game folder, emails and IP addresses replaced.
  - type: textarea
    id: block
    attributes:
      label: Share block
      description: Paste the Markdown block from the launcher.
      render: markdown
    validations:
      required: true
  - type: checkboxes
    id: confirm
    attributes:
      label: Before submitting
      options:
        - label: The block contains nothing private (it was copied straight from the launcher).
          required: true
